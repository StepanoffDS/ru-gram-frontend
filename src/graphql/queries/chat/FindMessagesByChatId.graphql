query FindMessagesByChatId(
  $chatId: String!
  $pagination: MessagesPaginationInput
) {
  findMessagesByChatId(chatId: $chatId, pagination: $pagination) {
    id
    content
    images
    isReadByOtherUser
    createdAt
    updatedAt
    user {
      id
      username
      name
      avatar
    }
  }
}
