query FindAllChatsByMe {
  findAllChatsByMe {
    id
    createdAt
    updatedAt
    isImportant
    unreadCount
    users {
      id
      username
      name
      avatar
    }
    messages {
      id
      content
      images
      createdAt
      user {
        id
        username
        name
        avatar
      }
    }
  }
}
